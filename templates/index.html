<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Analyzer</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto p-8">

<h1 class="text-4xl font-bold text-center mb-2 text-gray-800">
AI Resume Analyzer
</h1>

<p class="text-center text-gray-500 mb-10">
Upload your resume and compare it with job descriptions using AI
</p>

<div class="grid md:grid-cols-2 gap-8">


<div class="bg-white shadow-xl rounded-xl p-6">

<h2 class="text-xl font-semibold mb-4">Upload Resume</h2>

<div
id="dropZone"
class="border-2 border-dashed border-gray-300 rounded-lg p-10 text-center cursor-pointer hover:bg-gray-50"
>
<p class="text-gray-500">Drag & Drop Resume PDF Here</p>
<p class="text-sm text-gray-400 mt-2">or click to select</p>

<input type="file" id="resumeFile" class="hidden">
</div>

<button
onclick="uploadResume()"
class="mt-4 w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700"
>
Upload Resume
</button>

</div>


<div class="bg-white shadow-xl rounded-xl p-6">

<h2 class="text-xl font-semibold mb-4">Job Description</h2>

<textarea
id="jobDescription"
rows="8"
placeholder="Paste the job description..."
class="w-full border rounded-lg p-3"
></textarea>

<button
onclick="analyzeResume()"
class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700"
>
Analyze Resume
</button>

</div>

</div>


<div class="mt-10 bg-white shadow-xl rounded-xl p-8">

<h2 class="text-2xl font-semibold mb-6">Analysis Result</h2>


<div class="mb-6">

<p class="text-gray-600 mb-2">ATS Score</p>

<div class="w-full bg-gray-200 rounded-full h-6">

<div
id="atsBar"
class="bg-green-500 h-6 rounded-full text-center text-white text-sm"
style="width:0%"
>
0%
</div>

</div>

</div>


<div class="grid md:grid-cols-3 gap-6">

<div class="bg-gray-50 p-4 rounded-lg">

<h3 class="font-semibold mb-2 text-red-500">
Skill Gap
</h3>

<ul id="skillGap" class="text-sm text-gray-700"></ul>

</div>

<div class="bg-gray-50 p-4 rounded-lg">

<h3 class="font-semibold mb-2 text-yellow-500">
Missing Keywords
</h3>

<ul id="keywords" class="text-sm text-gray-700"></ul>

</div>

<div class="bg-gray-50 p-4 rounded-lg">

<h3 class="font-semibold mb-2 text-green-600">
Improvement Suggestions
</h3>

<ul id="suggestions" class="text-sm text-gray-700"></ul>

</div>

</div>

</div>

</div>


<script>

const dropZone = document.getElementById("dropZone")
const fileInput = document.getElementById("resumeFile")

dropZone.onclick = () => fileInput.click()

dropZone.addEventListener("dragover", e => {
e.preventDefault()
dropZone.classList.add("bg-gray-100")
})

dropZone.addEventListener("dragleave", () => {
dropZone.classList.remove("bg-gray-100")
})

dropZone.addEventListener("drop", e => {

e.preventDefault()

fileInput.files = e.dataTransfer.files

})


async function uploadResume(){

if(fileInput.files.length === 0){

alert("Select resume first")
return

}

const formData = new FormData()

formData.append("file", fileInput.files[0])

const response = await fetch("/upload",{
method:"POST",
body:formData
})

const data = await response.json()

alert("Resume uploaded successfully")

}


async function analyzeResume(){

const jobDescription = document.getElementById("jobDescription").value

const response = await fetch("/analyze",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
job_description:jobDescription
})

})

const data = await response.json()

displayResult(data.analysis)

}


function displayResult(text){

document.getElementById("skillGap").innerHTML=""
document.getElementById("keywords").innerHTML=""
document.getElementById("suggestions").innerHTML=""

const lines = text.split("\n")

let section=""

lines.forEach(line => {

if(line.includes("Skill Gap")) section="skill"
else if(line.includes("Missing Keywords")) section="keyword"
else if(line.includes("Improvement Suggestions")) section="suggestion"
else if(line.includes("ATS Score")){

let score=line.match(/\d+/)

if(score){

score=parseInt(score[0])

const bar=document.getElementById("atsBar")

bar.style.width=score+"%"

bar.innerText=score+"%"

}

}
else{

if(line.trim().startsWith("-")){

const item=line.replace("-","").trim()

const li="<li>• "+item+"</li>"

if(section==="skill")
document.getElementById("skillGap").innerHTML+=li

if(section==="keyword")
document.getElementById("keywords").innerHTML+=li

if(section==="suggestion")
document.getElementById("suggestions").innerHTML+=li

}

}

})

}

</script>

</body>

</html>
